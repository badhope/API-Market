name: Security Audit

# Scheduled weekly (so the build is never blocked) + manual trigger.
# Single job: `npm audit` on the frontend. Dependabot handles the
# auto-PR remediation, this job is the tripwire that surfaces
# anything Dependabot can't cover.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: security-audit
  cancel-in-progress: false

jobs:
  npm-audit:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --prefer-offline
      - name: Audit production dependencies
        working-directory: frontend
        # `--omit=dev` skips eslint / typescript / tailwind — those are
        # build-time only and never ship to the static bundle, so
        # vulnerabilities there can't affect a visitor. Dependabot
        # still covers dev-deps.
        run: |
          set -e
          OUTPUT=$(npm audit --omit=dev --json || true)
          CRIT=$(echo "$OUTPUT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log(j.metadata.vulnerabilities.critical||0)})")
          HIGH=$(echo "$OUTPUT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log(j.metadata.vulnerabilities.high||0)})")
          echo "::notice::npm audit summary — critical: $CRIT, high: $HIGH"
          echo "$OUTPUT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log(JSON.stringify(j.metadata.vulnerabilities,null,2))})"
          if [ "$CRIT" -gt 0 ]; then
            echo "::error::$CRIT critical npm vulnerabilities found"
            exit 1
          fi
          echo "No critical npm vulnerabilities."
