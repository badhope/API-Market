name: Validate Data

on:
  pull_request:
    paths:
      - "data/**"
      - "frontend/src/schemas/**"
      - "frontend/scripts/**"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "frontend/src/schemas/**"
      - "frontend/scripts/**"

permissions:
  contents: read

jobs:
  validate:
    name: Build data & frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build data
        working-directory: frontend
        # Validates every record under data/ with the Zod schema and
        # regenerates the static JSONs. A bad record fails this step.
        run: npm run build:data

      - name: Upload data artifacts
        uses: actions/upload-artifact@v5
        with:
          name: data-snapshot
          path: frontend/public/data
          retention-days: 7
